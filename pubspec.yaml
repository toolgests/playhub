name: playhub
description: Browse and play HTML5 games from a curated catalog.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.0.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  google_mobile_ads: ^6.0.0
  visibility_detector: ^0.4.0+2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  connectivity_plus: ^6.1.0
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0
  carousel_slider: ^5.1.2
  http: ^1.2.0
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.3
  firebase_remote_config: ^5.4.1
  firebase_database: ^11.3.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/playhub_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/playhub_logo.png"
  # assets:
  #   - assets/games.json
